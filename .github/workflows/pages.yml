name: Deploy Site

on:
  push:
    branches:
    - main
  pull_request:
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch: null

jobs:
  # Runs on pull requests too, so a change that breaks the build turns a check
  # red instead of turning production stale. Only the deploy is withheld.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    # The runtime is fetched, not committed (21 MB of wasm that does not
    # delta-compress), so cache it: otherwise every deploy depends on a CDN
    # being up, which the index is carefully allowed not to be.
    - name: Cache vendored runtime
      uses: actions/cache@v4
      with:
        path: vendor
        key: vendor-${{ hashFiles('Makefile') }}
    # The semantic index is built locally -- it needs a model and hours of CPU
    # -- and published as a release asset rather than committed, so that
    # regenerating it does not grow the repository forever (see #53). Fetched
    # here and unpacked for `make site` to pick up.
    #
    # Deliberately non-fatal. If no index has been released yet, or the
    # download fails, the site still builds and deploys; full-text search
    # reports itself unavailable and everything else works. A stale index is
    # likewise better than no site.
    - name: Fetch semantic index
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag=$(gh release list --limit 30 --json tagName \
              -q '[.[].tagName | select(startswith("index-"))] | first // empty')
        if [ -n "$tag" ] && gh release download "$tag" --pattern 'index.tar.gz' --dir .; then
          tar xzf index.tar.gz && rm -f index.tar.gz
          echo "index $tag: $(du -sh index | cut -f1), $(ls index/clusters | wc -l) clusters"
        else
          echo "no index release found; building without full-text search"
        fi
    - name: Build site
      run: make site
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deploy at a time; let a running one finish rather than cancelling it,
    # so we never leave a half-published site.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
