name: Deploy Site

on:
  push:
    branches:
    - main
  pull_request:
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch: null

jobs:
  # Has anything upstream actually moved? The cron exists to pick up newly
  # published RFCs, and most days there are none -- but a run still downloads
  # the index and uploads a ~225 MB artifact to republish it unchanged.
  #
  # The signature is the two upstreams' validators. A cache entry under that
  # key is the record that we have already published it, so a hit means there
  # is nothing to do. Entries expire after a week of not being read, which
  # costs one redundant deploy in a quiet fortnight.
  #
  # Only the schedule is gated. A push or a manual run is someone changing the
  # site itself, which upstream knows nothing about.
  upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
      signature: ${{ steps.probe.outputs.signature }}
    steps:
    - name: Read upstream validators
      id: probe
      if: github.event_name == 'schedule'
      run: |
        validator() {
          curl -sS -I -L --max-time 30 "$1" \
            | tr -d '\r' \
            | awk 'tolower($1) ~ /^(etag|last-modified):$/ { $1 = ""; print }' \
            | tail -1
        }
        index=$(validator https://www.rfc-editor.org/rfc-index.xml || true)
        refs=$(validator https://raw.githubusercontent.com/mnot/rfc-refs/main/refs.json || true)
        # No validator from either host means we cannot tell, so say nothing
        # and let the build run. Skipping on a failed probe would quietly
        # stop publishing.
        if [ -z "$index" ] || [ -z "$refs" ]; then
          echo "no validators (index='$index' refs='$refs'); building anyway"
        else
          sig=$(printf '%s|%s' "$index" "$refs" | sha256sum | cut -d' ' -f1)
          echo "signature=$sig" >> "$GITHUB_OUTPUT"
          echo "upstream signature $sig"
        fi
    - name: Look for a deploy of that signature
      id: seen
      if: steps.probe.outputs.signature != ''
      uses: actions/cache/restore@v4
      with:
        path: .upstream
        key: upstream-${{ steps.probe.outputs.signature }}
        lookup-only: true
    - name: Decide
      id: decide
      run: |
        if [ "${{ steps.seen.outputs.cache-hit }}" = "true" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "nothing new upstream since the last deploy; skipping"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

  # Runs on pull requests too, so a change that breaks the build turns a check
  # red instead of turning production stale. Only the deploy is withheld.
  build:
    needs: upstream
    if: needs.upstream.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    # The runtime is fetched, not committed (21 MB of wasm that does not
    # delta-compress), so cache it: otherwise every deploy depends on a CDN
    # being up, which the index is carefully allowed not to be.
    - name: Cache vendored runtime
      uses: actions/cache@v4
      with:
        path: vendor
        key: vendor-${{ hashFiles('Makefile') }}
    # The semantic index is built locally -- it needs a model and hours of CPU
    # -- and published as a release asset rather than committed, so that
    # regenerating it does not grow the repository forever (see #53).
    - name: Find the current index release
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
      # Only releases that actually carry the asset. An interrupted
      # `make index-release` can leave the newest tag with no index.tar.gz,
      # and newest-tag-wins would then pass over a perfectly good older one.
      run: |
        tag=$(gh api repos/{owner}/{repo}/releases --paginate -q \
              '[.[] | select(.tag_name | startswith("index-"))
                    | select(any(.assets[]?; .name == "index.tar.gz"))
                    | .tag_name] | sort | reverse | first // empty')
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "index release: ${tag:-none}"
    # Keyed on the tag, so it survives until the index is rebuilt. A daily
    # cron reads it daily, which keeps it clear of the eviction window.
    - name: Cache the index asset
      if: steps.release.outputs.tag != ''
      uses: actions/cache@v4
      with:
        path: index.tar.gz
        key: index-asset-${{ steps.release.outputs.tag }}
    # Deliberately non-fatal. If no index has been released yet, or the
    # download fails, the site still builds and deploys; full-text search
    # reports itself unavailable and everything else works. A stale index is
    # likewise better than no site.
    - name: Unpack the semantic index
      if: steps.release.outputs.tag != ''
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.release.outputs.tag }}
      run: |
        if [ ! -f index.tar.gz ]; then
          gh release download "$TAG" --pattern 'index.tar.gz' --dir . || true
        fi
        if [ -f index.tar.gz ] && tar xzf index.tar.gz; then
          echo "index $TAG: $(du -sh index | cut -f1), $(ls index/clusters | wc -l) clusters"
        else
          echo "no usable index asset; building without full-text search"
          rm -rf index
        fi
    - name: Build site
      run: make site
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: _site
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deploy at a time; let a running one finish rather than cancelling it,
    # so we never leave a half-published site.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

  # The signature says a deploy of it happened, so it is written after one
  # has -- `needs: deploy`, not at the end of the build. Recording it earlier
  # would let a Pages outage suppress every following scheduled run until
  # upstream next changed, which at 10-25 RFCs a month can be weeks of the
  # site quietly going stale.
  record:
    needs: [upstream, build, deploy]
    if: needs.upstream.outputs.signature != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Note what was published
      run: date -u > .upstream
    - name: Record the upstream signature
      uses: actions/cache/save@v4
      with:
        path: .upstream
        key: upstream-${{ needs.upstream.outputs.signature }}
